 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<title>Controle Financeiro</title>
<script>
/* Ícones e manifesto embutidos (equivale ao manifest.json) — gerados em tempo de execução */
(function () {
function icone(t) {
var c = document.createElement('canvas'); c.width = c.height = t;
var x = c.getContext('2d'), s = t / 512;
var g = x.createLinearGradient(0, 0, t, t);
g.addColorStop(0, '#4f46e5'); g.addColorStop(1, '#9333ea');
x.fillStyle = g; x.fillRect(0, 0, t, t);
function rr(px, py, w, h, r, cor) {
px *= s; py *= s; w *= s; h *= s; r *= s;
x.beginPath(); x.moveTo(px + r, py);
x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r);
x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r);
x.closePath(); x.fillStyle = cor; x.fill();
}
rr(136, 176, 240, 180, 34, '#fff');
rr(136, 148, 200, 48, 22, '#fff');
rr(296, 236, 80, 60, 22, '#743ce8');
x.beginPath(); x.arc(328 * s, 266 * s, 10 * s, 0, 7); x.fillStyle = '#fff'; x.fill();
return c.toDataURL('image/png');
}
function addLink(rel, href, extra) {
var l = document.createElement('link'); l.rel = rel; l.href = href;
if (extra) l.sizes = extra; document.head.appendChild(l);
}
var i192 = icone(192), i512 = icone(512);
addLink('icon', icone(64)); addLink('apple-touch-icon', icone(180), '180x180');
var base = location.origin + location.pathname.replace(/[^\/]*$/, '');
var manifesto = {
id: base, name: 'Controle Financeiro', short_name: 'Financeiro',
description: 'Gestão de contas mensais', start_url: base, scope: base,
display: 'standalone', orientation: 'portrait',
background_color: '#09090b', theme_color: '#4f46e5',
icons: [
{ src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
{ src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' }
]
};
addLink('manifest', URL.createObjectURL(new Blob([JSON.stringify(manifesto)], { type: 'application/manifest+json' })));
})();
</script>
<style>:root{--bg:#f6f7fb;--card:#fff;--borda:#e3e5ee;--texto:#14151f;--suave:#6b6f82;--prim:#4f46e5;--prim-t:#fff;--total-bg:#efeffd;--total-bd:#d9d8f7;--total-c:#4f46e5;--ok-bg:#e6f6ef;--ok-bd:#bfe6d4;--ok-c:#059669;--pe-bg:#fffaf0;--pe-bd:#f8e7bd;--pe-c:#d97706;--ve-bg:#fceded;--ve-bd:#f3c4c4;--ve-c:#dc2626;--campo:#fff;--chave:#f1f2f7;color-scheme:light;}[data-tema="escuro"]{--bg:#09090b;--card:#09090b;--borda:#26262c;--texto:#fff;--suave:#9a9aa6;--total-bg:#14142a;--total-bd:#26264d;--total-c:#818cf8;--ok-bg:#0b1f1a;--ok-bd:#12382d;--ok-c:#34d399;--pe-bg:#0a0a0a;--pe-bd:#3a2d10;--pe-c:#fbbf24;--ve-bg:#1f1010;--ve-bd:#4a1d1d;--ve-c:#f87171;--campo:#09090b;--chave:#232326;color-scheme:dark;}*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--texto);min-height:100vh;transition:background .25s,color .25s}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--prim);outline-offset:2px}.topo{border-bottom:1px solid var(--borda);background:var(--bg);position:sticky;top:0;z-index:5}.topo-in{max-width:960px;margin:auto;padding:16px;display:flex;align-items:center;gap:12px}.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#4f46e5,#9333ea);display:grid;place-items:center;flex:none}.logo svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.titulo{flex:1;min-width:0}.titulo h1{font-size:1.2rem;line-height:1.2}.titulo p{color:var(--suave);font-size:.9rem}.btn-icone{width:48px;height:48px;border-radius:12px;border:1px solid var(--borda);background:transparent;font-size:1.3rem;flex:none}.btn-primario{background:var(--prim);color:var(--prim-t);border:0;border-radius:12px;padding:0 20px;height:48px;font-weight:600;font-size:1rem;flex:none}.btn-primario:hover{filter:brightness(1.1)}.btn-sec{background:transparent;border:1px solid var(--borda);border-radius:12px;height:48px;font-weight:600}.cheio{width:100%}.conteudo{max-width:960px;margin:auto;padding:24px 16px 48px;display:grid;gap:16px}.card{border:1px solid var(--borda);border-radius:20px;background:var(--card);padding:20px}.rotulo{color:var(--suave);font-size:.95rem}.progresso .linha{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.progresso strong{color:var(--prim)}[data-tema="escuro"] .progresso strong{color:#818cf8}.barra{height:12px;background:var(--chave);border-radius:99px;overflow:hidden}#pBarra{height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#9333ea);border-radius:99px;transition:width .5s}.resumo{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.resumo .card{display:flex;flex-direction:column;gap:10px;min-height:120px}.resumo strong{font-size:1.5rem}.resumo small{color:var(--suave);font-size:.95rem}.total{background:var(--total-bg);border-color:var(--total-bd)}.total strong{color:var(--total-c)}.pagas{background:var(--ok-bg);border-color:var(--ok-bd)}.pagas strong{color:var(--ok-c)}.pend{background:var(--pe-bg);border-color:var(--pe-bd)}.pend strong{color:var(--pe-c)}.venc{background:var(--ve-bg);border-color:var(--ve-bd)}.venc strong{color:var(--ve-c)}.filtros{display:grid;gap:12px}.filtros input,.filtros select,.modal input:not([type=checkbox]),.modal select,.modal textarea{width:100%;background:var(--campo);border:1px solid var(--borda);border-radius:12px;padding:14px;min-height:48px}.filtros input:focus,.modal input:focus,.modal select:focus,.modal textarea:focus{outline:2px solid var(--prim);border-color:transparent}.lista{display:grid;gap:12px}.vazio{text-align:center;color:var(--suave);padding:40px 0}.item{display:flex;gap:12px;align-items:center;border:1px solid var(--borda);border-radius:16px;padding:14px 16px;flex-wrap:wrap}.item .info{flex:1;min-width:150px}.item h3{font-size:1rem}.item p{color:var(--suave);font-size:.85rem;margin-top:2px}.item .valor{font-weight:700}.tag{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;margin-left:6px;vertical-align:middle}.tag.paga{background:var(--ok-bg);color:var(--ok-c)}.tag.pendente{background:var(--pe-bg);color:var(--pe-c);border:1px solid var(--pe-bd)}.tag.vencida{background:var(--ve-bg);color:var(--ve-c)}.acoes{display:flex;gap:6px}.acoes button{border:1px solid var(--borda);background:transparent;border-radius:10px;width:40px;height:40px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}.modal[hidden]{display:none}.modal-box{background:var(--bg);width:100%;max-width:520px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:28px 20px 20px;position:relative;display:grid;gap:8px}.modal-box h2{text-align:center;margin-bottom:12px;font-size:1.3rem}.modal label{font-weight:600;margin-top:10px;display:block}.fechar{position:absolute;top:16px;right:16px;border:0;background:none;font-size:1.3rem}.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal .chave{display:flex;justify-content:space-between;align-items:center;background:var(--chave);border-radius:14px;padding:16px;margin:14px 0 4px;position:relative;cursor:pointer}.chave input{position:absolute;opacity:0}.chave i{width:46px;height:26px;border-radius:99px;background:var(--borda);position:relative;transition:.2s;flex:none}.chave i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.chave input:checked + i{background:var(--prim)}.chave input:checked + i::after{left:23px}.chave input:focus-visible + i{outline:2px solid var(--prim);outline-offset:2px}#btnSalvar{margin-top:12px}@media(min-width:720px){.resumo{grid-template-columns:repeat(4,1fr)}.filtros{grid-template-columns:2fr 1fr 1fr}.modal{align-items:center}.modal-box{border-radius:24px}.titulo h1{font-size:1.5rem}}@media(max-width:380px){.btn-primario span{display:none}.btn-primario{padding:0 16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.alertas{display:grid;gap:12px}.alertas[hidden]{display:none}.alerta{display:flex;flex-direction:column;gap:4px;border:1px solid;border-radius:16px;padding:14px 16px}.alerta span{font-size:.9rem;opacity:.9}.venc-a{background:var(--ve-bg);border-color:var(--ve-bd);color:var(--ve-c)}.prox-a{background:var(--pe-bg);border-color:var(--pe-bd);color:var(--pe-c)}.tag.prox{background:var(--pe-bg);color:var(--pe-c);border:1px solid var(--pe-bd)}</style>
</head>
<body>
<header class="topo">
<div class="topo-in">
<div class="logo" aria-hidden="true">
<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v3"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M21 12v4h-4a2 2 0 0 1 0-4z"/></svg>
</div>
<div class="titulo">
<h1>Controle Financeiro</h1>
<p>Gestão de contas mensais</p>
</div>
<button id="btnTema" class="btn-icone" type="button" aria-label="Alternar tema"></button>
<button id="btnNova" class="btn-primario" type="button">+ <span>Nova</span></button>
</div>
</header>
<main class="conteudo">
<section class="card progresso">
<div class="linha"><span class="rotulo">↗ Progresso do mês</span><strong id="pPct">0%</strong></div>
<div class="barra"><div id="pBarra"></div></div>
</section>
<section id="alertas" class="alertas" hidden></section>
<section class="resumo">
<article class="card total"><span class="rotulo">Total no mês</span><strong id="vTotal">R$ 0,00</strong><small id="cTotal">0 conta(s)</small></article>
<article class="card pagas"><span class="rotulo">Pagas</span><strong id="vPagas">R$ 0,00</strong><small id="cPagas">0 conta(s)</small></article>
<article class="card pend"><span class="rotulo">Pendentes</span><strong id="vPend">R$ 0,00</strong><small id="cPend">0 conta(s)</small></article>
<article class="card venc"><span class="rotulo">Vencidas</span><strong id="vVenc">R$ 0,00</strong><small id="cVenc">0 conta(s)</small></article>
</section>
<section class="filtros">
<input id="busca" type="search" placeholder="Buscar conta...">
<select id="fStatus">
<option value="">Todos status</option>
<option value="pendente">Pendente</option>
<option value="paga">Paga</option>
<option value="vencida">Vencida</option>
</select>
<select id="fCat"><option value="">Todas categorias</option></select>
</section>
<section id="lista" class="lista"></section>
</main>
<div id="modal" class="modal" hidden>
<form id="form" class="modal-box" autocomplete="off">
<button type="button" class="fechar" id="btnFechar" aria-label="Fechar">✕</button>
<h2 id="mTitulo">Nova Conta</h2>
<input type="hidden" id="fId">
<label for="fNome">Nome da Conta</label>
<input id="fNome" required placeholder="Ex: Conta de Luz">
<div class="duas">
<div><label for="fCategoria">Categoria</label><select id="fCategoria"></select></div>
<div><label for="fValor">Valor (R$)</label><input id="fValor" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00" required></div>
</div>
<div class="duas">
<div><label for="fVenc">Vencimento</label><input id="fVenc" type="date" required></div>
<div><label for="fSt">Status</label>
<select id="fSt"><option value="pendente">Pendente</option><option value="paga">Paga</option><option value="vencida">Vencida</option></select>
</div>
</div>
<label class="chave" for="fRec">
<span>Conta recorrente (mensal)</span>
<input id="fRec" type="checkbox"><i></i>
</label>
<label for="fObs">Observação (opcional)</label>
<textarea id="fObs" rows="3" placeholder="Detalhes adicionais..."></textarea>
<button type="submit" class="btn-primario cheio" id="btnSalvar">Adicionar</button>
<button type="button" class="btn-sec cheio" id="btnCancelar">Cancelar</button>
</form>
</div>
<script>
const LS={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
(() => {
const CATEGORIAS = ['Moradia','Energia','Água','Internet','Alimentação','Transporte','Saúde','Educação','Lazer','Cartão','Outros'];
const CHAVE = 'controle-financeiro:contas';
const $ = id => document.getElementById(id);
const brl = v => v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const DIAS_ALERTA = 3; // avisar contas que vencem em até 3 dias
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const diasAte = v => Math.round((new Date(v + 'T00:00:00') - new Date(hoje() + 'T00:00:00')) / 864e5);
const textoPrazo = n => n === 0 ? 'vence hoje' : n === 1 ? 'vence amanhã' : 'vence em ' + n + ' dias';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let contas = [];
try { contas = JSON.parse(LS.get(CHAVE)) || []; } catch { contas = []; }
const salvar = () => LS.set(CHAVE, JSON.stringify(contas));
/* ---------- Tema ---------- */
function aplicarTema(t) {
document.documentElement.dataset.tema = t;
$('btnTema').textContent = t === 'escuro' ? '☀' : '☾';
$('btnTema').title = t === 'escuro' ? 'Mudar para tema claro' : 'Mudar para tema escuro';
document.querySelector('meta[name=theme-color]').content = t === 'escuro' ? '#09090b' : '#f6f7fb';
LS.set('controle-financeiro:tema', t);
}
aplicarTema(LS.get('controle-financeiro:tema') ||
(matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro'));
$('btnTema').onclick = () => aplicarTema(document.documentElement.dataset.tema === 'escuro' ? 'claro' : 'escuro');
/* ---------- Selects ---------- */
CATEGORIAS.forEach(c => {
$('fCategoria').add(new Option(c, c));
$('fCat').add(new Option(c, c));
});
$('fCategoria').value = 'Outros';
/* ---------- Regras ---------- */
const situacao = c => c.status === 'paga' ? 'paga' : (c.status === 'vencida' || c.venc < hoje() ? 'vencida' : 'pendente');
const mesAtual = () => hoje().slice(0,7);
// Gera as contas recorrentes do mês atual, se ainda não existirem
function gerarRecorrentes() {
const mes = mesAtual();
const base = {};
contas.filter(c => c.rec && c.venc.slice(0,7) < mes).forEach(c => {
if (!base[c.nome] || c.venc > base[c.nome].venc) base[c.nome] = c;
});
Object.values(base).forEach(c => {
if (contas.some(x => x.nome === c.nome && x.venc.slice(0,7) === mes)) return;
const dia = c.venc.slice(8);
const ultimo = new Date(+mes.slice(0,4), +mes.slice(5), 0).getDate();
contas.push({ ...c, id: crypto.randomUUID(), status:'pendente', venc: `${mes}-${String(Math.min(+dia, ultimo)).padStart(2,'0')}` });
});
salvar();
}
/* ---------- Render ---------- */
function render() {
const mes = mesAtual();
const doMes = contas.filter(c => c.venc.slice(0,7) === mes);
const soma = a => a.reduce((t,c) => t + c.valor, 0);
const pagas = doMes.filter(c => situacao(c) === 'paga');
const pend = doMes.filter(c => situacao(c) === 'pendente');
const venc = contas.filter(c => situacao(c) === 'vencida');
$('vTotal').textContent = brl(soma(doMes)); $('cTotal').textContent = `${doMes.length} conta(s)`;
$('vPagas').textContent = brl(soma(pagas)); $('cPagas').textContent = `${pagas.length} conta(s)`;
$('vPend').textContent = brl(soma(pend)); $('cPend').textContent = `${pend.length} conta(s)`;
$('vVenc').textContent = brl(soma(venc)); $('cVenc').textContent = `${venc.length} conta(s)`;
const pct = doMes.length ? Math.round(pagas.length / doMes.length * 100) : 0;
$('pPct').textContent = pct + '%'; $('pBarra').style.width = pct + '%';
const proximas = contas.filter(c => situacao(c) === 'pendente' && diasAte(c.venc) >= 0 && diasAte(c.venc) <= DIAS_ALERTA).sort((a,b) => a.venc.localeCompare(b.venc));
let al = '';
if (venc.length) al += `<div class="alerta venc-a"><strong>⚠ ${venc.length} conta(s) vencida(s)</strong><span>${venc.map(c => esc(c.nome)).join(', ')}</span></div>`;
if (proximas.length) al += `<div class="alerta prox-a"><strong>⏰ ${proximas.length} conta(s) perto de vencer</strong><span>${proximas.map(c => esc(c.nome) + ' (' + textoPrazo(diasAte(c.venc)) + ')').join(' • ')}</span></div>`;
$('alertas').innerHTML = al; $('alertas').hidden = !al;
const q = $('busca').value.trim().toLowerCase(), fs = $('fStatus').value, fc = $('fCat').value;
const vis = contas.filter(c => (!q || c.nome.toLowerCase().includes(q)) && (!fs || situacao(c) === fs) && (!fc || c.categoria === fc))
.sort((a,b) => a.venc.localeCompare(b.venc));
$('lista').innerHTML = vis.length ? vis.map(c => {
const s = situacao(c), [y,m,d] = c.venc.split('-'), n = diasAte(c.venc), prox = s === 'pendente' && n >= 0 && n <= DIAS_ALERTA;
return `<div class="item" data-id="${c.id}">
<div class="info"><h3>${esc(c.nome)}<span class="tag ${s}">${s[0].toUpperCase() + s.slice(1)}</span>${prox ? `<span class="tag prox">${textoPrazo(n)}</span>` : ''}</h3>
<p>${esc(c.categoria)} • vence ${d}/${m}/${y}${c.rec ? ' • mensal' : ''}${c.obs ? ' • ' + esc(c.obs) : ''}</p></div>
<span class="valor">${brl(c.valor)}</span>
<div class="acoes">
<button data-a="pagar" title="${c.status === 'paga' ? 'Marcar como pendente' : 'Marcar como paga'}" aria-label="Alternar pagamento">${c.status === 'paga' ? '↺' : '✓'}</button>
<button data-a="editar" title="Editar" aria-label="Editar">✎</button>
<button data-a="excluir" title="Excluir" aria-label="Excluir">🗑</button>
</div></div>`;
}).join('') : '<p class="vazio">Nenhuma conta encontrada. Toque em “Nova” para adicionar.</p>';
}
/* ---------- Modal ---------- */
function abrir(c) {
$('form').reset();
$('fId').value = c ? c.id : '';
$('mTitulo').textContent = c ? 'Editar Conta' : 'Nova Conta';
$('btnSalvar').textContent = c ? 'Salvar' : 'Adicionar';
if (c) {
$('fNome').value = c.nome; $('fCategoria').value = c.categoria; $('fValor').value = c.valor;
$('fVenc').value = c.venc; $('fSt').value = c.status; $('fRec').checked = c.rec; $('fObs').value = c.obs || '';
} else { $('fCategoria').value = 'Outros'; }
$('modal').hidden = false;
$('fNome').focus();
}
const fechar = () => { $('modal').hidden = true; };
$('btnNova').onclick = () => abrir();
$('btnFechar').onclick = $('btnCancelar').onclick = fechar;
$('modal').onclick = e => { if (e.target === $('modal')) fechar(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
$('form').onsubmit = e => {
e.preventDefault();
const dados = {
nome: $('fNome').value.trim(), categoria: $('fCategoria').value, valor: parseFloat($('fValor').value) || 0,
venc: $('fVenc').value, status: $('fSt').value, rec: $('fRec').checked, obs: $('fObs').value.trim()
};
const id = $('fId').value;
if (id) Object.assign(contas.find(c => c.id === id), dados);
else contas.push({ id: crypto.randomUUID(), ...dados });
salvar(); fechar(); render();
};
/* ---------- Ações da lista ---------- */
$('lista').onclick = e => {
const b = e.target.closest('button'); if (!b) return;
const id = b.closest('.item').dataset.id, c = contas.find(x => x.id === id);
if (b.dataset.a === 'pagar') c.status = c.status === 'paga' ? 'pendente' : 'paga';
else if (b.dataset.a === 'editar') return abrir(c);
else if (b.dataset.a === 'excluir') { if (!confirm(`Excluir "${c.nome}"?`)) return; contas = contas.filter(x => x.id !== id); }
salvar(); render();
};
['busca','fStatus','fCat'].forEach(id => $(id).addEventListener('input', render));
gerarRecorrentes();
render();
})();
</script>
</body>
</html>
